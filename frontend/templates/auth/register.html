{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<h2 class="mb-3">Create account</h2>
<form method="post">
  <div class="mb-3"><label class="form-label">Name</label>
    <input class="form-control" type="text" name="name" required></div>
  <div class="mb-3"><label class="form-label">Email</label>
    <input class="form-control" type="email" name="email" required></div>
  <div class="mb-3"><label class="form-label">Password</label>
    <input class="form-control" type="password" name="password" minlength="6" required></div>
  <div class="mb-3"><label class="form-label">I am a</label>
    <select class="form-select" name="role" required>
      <option value="seeker">Job Seeker</option>
      <option value="recruiter" {{ 'selected' if request.args.get('role') == 'recruiter' }}>Recruiter</option>
    </select></div>
  <button class="btn btn-primary w-100">Create account</button>
</form>
<p class="mt-3">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
</div></div>
{% endblock %}
