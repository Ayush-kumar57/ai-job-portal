{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<h2 class="mb-3">Login</h2>
<form method="post">
  <div class="mb-3"><label class="form-label">Email</label>
    <input class="form-control" type="email" name="email" required></div>
  <div class="mb-3"><label class="form-label">Password</label>
    <input class="form-control" type="password" name="password" required></div>
  <button class="btn btn-primary w-100">Login</button>
</form>
<p class="mt-3"><a href="{{ url_for('auth.forgot') }}">Forgot password?</a> · <a href="{{ url_for('auth.register') }}">Register</a></p>
</div></div>
{% endblock %}
